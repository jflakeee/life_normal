name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check            # svelte-check (타입)
      - run: npm test                 # 규칙·백엔드·전체 규모 밸런스 회귀(시드 3개)
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - run: npm run size             # JS 150 KB(gzip) 예산
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e              # 360×640 세로 화면, Pages와 같은 하위 경로
