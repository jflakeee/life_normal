[project]
name = "daily-missions"
version = "0.3.0"
description = "일상 임무 게임 코어, 시뮬레이터, CLI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: 전체 규모 밸런스 시뮬레이션"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.pyright]
include = ["core", "sim", "tools", "server"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
